name: Deploy to Capgo
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - run: npx @capgo/cli@latest bundle upload -a 6ed58d6f-5b79-4dac-acbd-98c5f60ad63d -c production
