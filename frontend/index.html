<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#08182b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MacFeed" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Apply theme immediately to prevent blur blink on load -->
    <script>
      (function() {
        try {
          const theme = 'black-white';
          document.documentElement.className = theme;
          document.body.style.backgroundColor = '#08182b';
        } catch(e) {
          document.documentElement.className = 'black-white';
          document.body.style.backgroundColor = '#08182b';
        }
      })();
    </script>

    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://s.ytimg.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://uopgmcysfudewwaiopue.supabase.co" crossorigin />
    
    <title>MacFeed</title>
    <script>
      // Check for new version and notify if necessary
      window.addEventListener('load', () => {
        const currentVersion = '1.1.15'; 
        const storedVersion = localStorage.getItem('macfeed_version');
        if (storedVersion !== currentVersion) {
          localStorage.setItem('macfeed_version', currentVersion);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div> 
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
