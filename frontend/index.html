<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Deployment Version: 1.0.5 - Orientation & Resume Fixes -->

    <!-- Pre-connect to YouTube -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://s.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    
    <script src="https://www.youtube.com/iframe_api" async></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    
    <title>MacFeed - Pro Hub</title>
    <script>
      // Force clear old service workers to resolve black screen on refresh
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      // Check for new version and force reload if necessary
      window.addEventListener('load', () => {
        const currentVersion = '1.0.6'; 
        const storedVersion = localStorage.getItem('macfeed_version');
        if (storedVersion !== currentVersion) {
          localStorage.setItem('macfeed_version', currentVersion);
          location.reload(true); // Force clear cache reload
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div> 
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
