<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MacFeed" />
    
    <!-- Deployment Version: v1.1.1 - Mobile Rotation Fixes -->

    <!-- Apply theme immediately to prevent blur blink on load -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('macfeed_theme') || 'dark';
          document.documentElement.className = theme;
          document.body.style.backgroundColor = theme === 'light' ? '#eff6ff' : theme === 'blue' ? '#E0F2FE' : '#0f1115';
        } catch(e) {
          document.documentElement.className = 'dark';
          document.body.style.backgroundColor = '#0f1115';
        }
      })();
    </script>

    <!-- Performance: DNS Prefetch & Preconnect to Critical Domains -->
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://s.ytimg.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.youtube.com" crossorigin />
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="preconnect" href="https://s.ytimg.com" />
    <link rel="preconnect" href="https://uopgmcysfudewwaiopue.supabase.co" crossorigin />
    
    <!-- Preload Critical Resources Handled by Vite -->
    
    <!-- Scripts -->
    <script src="https://www.youtube.com/iframe_api" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <title>MacFeed - Final Sync</title>
    <script>
      // Check for new version and notify if necessary
      window.addEventListener('load', () => {
        const currentVersion = '1.1.14'; 
        const storedVersion = localStorage.getItem('macfeed_version');
        if (storedVersion !== currentVersion) {
          localStorage.setItem('macfeed_version', currentVersion);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div> 
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
